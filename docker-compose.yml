services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow_user} -d ${POSTGRES_DB:-stockflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stockflow-backend:latest
    container_name: stockflow-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stockflow_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stockflow_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stockflow_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:80,http://127.0.0.1}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - stockflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: stockflow-frontend:latest
    container_name: stockflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
      - "${FRONTEND_PORT_ALT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stockflow-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stockflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@stockflow.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - stockflow-network

volumes:
  postgres_data:
    name: stockflow_postgres_data

networks:
  stockflow-network:
    name: stockflow-network
    driver: bridge
